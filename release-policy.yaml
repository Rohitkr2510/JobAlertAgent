version: 1
minimum_score: 80
fail_on_blocker: true

required_files:
  - README.md
  - Dockerfile
  - CHANGELOG.md
  - rollback.md

docker:
  require_non_root_user: true
  require_healthcheck: true
  prohibit_latest_tag: true

repository:
  prohibit_large_files_mb: 10
  scan_secrets: true

weights:
  required_files: 30
  docker: 40
  secrets: 20
  repository: 10

