name: Bug report
description: Report a reproducible JobAlertAgent defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include Gmail addresses, tokens, authorization URLs, message bodies, databases, or reports.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker Compose, Native Python, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
