name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Validate documentation structure and links
        run: python scripts/validate_docs.py --extract-mermaid /tmp/mermaid
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Render every Mermaid diagram
        run: |
          for diagram in /tmp/mermaid/*.mmd; do
            npx --yes @mermaid-js/mermaid-cli@11.16.0 \
              --puppeteerConfigFile scripts/puppeteer-config.json \
              --input "$diagram" --output "${diagram%.mmd}.svg"
          done
      - name: Upload rendered architecture evidence
        uses: actions/upload-artifact@v7
        with:
          name: rendered-mermaid-diagrams
          path: /tmp/mermaid/*.svg
          retention-days: 14
