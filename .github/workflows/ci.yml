name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e '.[dev,gmail,ui,ops]'
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src/jobalert
      - name: Tests and coverage
        run: pytest --cov=jobalert --cov-report=term-missing --cov-report=xml --cov-report=html
      - run: jobalert self-check
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            coverage.xml
            htmlcov/
            dist/
          retention-days: 14

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.monitoring.yaml config --quiet
      - run: docker build -t job-alert-agent:ci .
      - name: Start dashboard
        run: docker run -d --name jobalert-ui -p 8501:8501 job-alert-agent:ci
      - name: Validate live UI health
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs jobalert-ui
          exit 1
      - name: Start operations API
        run: |
          docker run -d --name jobalert-ops -p 8080:8080 \
            --entrypoint uvicorn job-alert-agent:ci \
            jobalert.ops:app --host 0.0.0.0 --port 8080
      - name: Validate operations endpoints
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:8080/health/live && break
            sleep 2
          done
          curl --fail http://localhost:8080/metrics
      - name: Container logs
        if: always()
        run: |
          docker logs jobalert-ui || true
          docker logs jobalert-ops || true

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install PyYAML
      - name: Validate Prometheus configuration
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/alerts.yml
      - name: Validate monitoring YAML and Grafana JSON
        run: python scripts/validate_monitoring.py
