name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: releaseguard scan . --policy release-policy.yaml --output reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: releaseguard-report
          path: reports/

