name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e '.[dev,gmail,ui,ops]'
      - run: bandit -c pyproject.toml -r src
      - run: pip-audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint:v2.14.0-debian < Dockerfile
      - run: docker build -t job-alert-agent:security .
      - name: Generate Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: job-alert-agent:security
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: "0"
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
      - name: Enforce HIGH and CRITICAL vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: job-alert-agent:security
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: "1"

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:python
