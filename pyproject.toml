[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-alert-agent"
version = "0.4.0"
description = "Offline-first multi-account Gmail job alert dashboard"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Rohit Kumar Mahato" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "msgpack>=1.2.1,<2",
  "openpyxl>=3.1,<4",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
gmail = [
  "google-api-python-client>=2.140,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
]
ui = [
  "apscheduler>=3.10,<4",
  "cryptography>=43,<51",
  "pandas>=2.2,<4",
  "streamlit>=1.38,<2",
  "tzdata>=2025.2",
]
ops = [
  "fastapi>=0.116,<1",
  "prometheus-client>=0.22,<1",
  "uvicorn[standard]>=0.35,<1",
]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
jobalert = "jobalert.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobalert"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["jobalert"]
omit = ["src/jobalert/ui.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
