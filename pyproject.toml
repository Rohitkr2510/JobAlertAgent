[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-alert-agent"
version = "0.1.0"
description = "Offline-first Gmail job alert collector and Excel report generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohit Kumar Mahato" }]
dependencies = ["beautifulsoup4>=4.12,<5", "openpyxl>=3.1,<4", "pyyaml>=6,<7"]

[project.optional-dependencies]
gmail = [
  "google-api-python-client>=2.140,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
jobalert = "jobalert.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobalert"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
