[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "releaseguard"
version = "0.1.0"
description = "Offline, policy-driven release readiness agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohit Kumar Mahato" }]
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
releaseguard = "releaseguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/releaseguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/releaseguard/reporting.py" = ["E501"]
